<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Aluno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1 class="title">Painel do Aluno</h1>

    <!-- Top bar: avatar / level+progress / money -->
    <section class="topbar">
      <div class="avatar" title="Perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.4"/>
          <path d="M5 19c0-4 3.4-6.2 7-6.2s7 2.2 7 6.2"/>
        </svg>
      </div>

      <div class="level">
        <span class="level-label">Nível 3</span>
        <div class="progress" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
          <span class="fill"></span>
        </div>
      </div>

      <div class="money">
        <span class="coin">$</span>
        <span class="amount">500</span>
      </div>
    </section>

    <!-- Main grid: quick actions + missions -->
    <section class="grid">
      <div class="actions-grid">
        <a class="tile" href="#missoes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 4v16"/>
            <path d="M7 5h9l-2 3 2 3H7"/>
          </svg>
          <span>Missões</span>
        </a>
        <a class="tile" href="#ranking">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7l1.4 3 3.3 .3-2.5 2.2 .8 3.2-2.9-1.7-2.9 1.7 .8-3.2-2.5-2.2 3.3-.3z"/>
          </svg>
          <span>Ranking</span>
        </a>
        <a class="tile" href="#carteira">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="7" width="16" height="11" rx="2"/>
            <path d="M4 11h16"/>
            <circle cx="17" cy="14" r="1.1"/>
          </svg>
          <span>Carteira</span>
        </a>
        <a class="tile" href="#loja">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 8h14l-1.6 8H7z"/>
            <path d="M5 8l-2-3"/>
            <circle cx="8" cy="19" r="1.2"/>
            <circle cx="16" cy="19" r="1.2"/>
          </svg>
          <span>Loja</span>
        </a>
      </div>

      <div class="missions">
        <h2 class="missions-title">Missões</h2>
        <ul class="mission-list">
          <li class="mission">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12l4 4 8-9"/></svg>
            <span>Simulador de Troco</span>
          </li>
          <li class="mission">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12l4 4 8-9"/></svg>
            <span>Parcelado vs à Vista</span>
          </li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
