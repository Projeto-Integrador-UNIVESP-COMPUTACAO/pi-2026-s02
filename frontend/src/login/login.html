<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma de Educação Financeira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1 class="title">Plataforma de Educação Financeira</h1>

    <div class="logo" aria-hidden="true">$</div>

    <form onsubmit="return false;">
      <div class="field">
        <label for="user">Usuário</label>
        <input type="text" id="user" name="user" value="ID:345G7B" autocomplete="username" />
      </div>

      <div class="field">
        <label for="pass">Senha</label>
        <input type="password" id="pass" name="pass" value="1234567890" autocomplete="current-password" />
      </div>

      <div class="actions">
        <button type="submit">Entrar na Aventura</button>
      </div>
    </form>
  </main>
</body>
</html>
